# Corre las pruebas automatizadas con PostgreSQL en cada push y pull request (GitHub Actions, gratuito).
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: extinpro
          POSTGRES_PASSWORD: extinpro_ci
          POSTGRES_DB: extinpro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U extinpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: clave-solo-para-ci
      DEBUG: "False"
      DATABASE_URL: postgres://extinpro:extinpro_ci@localhost:5432/extinpro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test pruebas --noinput
